<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light">
    <title>Calendario de Turnos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body" data-i18n-title="loginTitle">
    <form id="loginForm" class="login-card" autocomplete="on">
        <div id="langSwitcher" class="lang-switcher lang-switcher--login"></div>

        <h1 data-i18n="loginTitle">Calendario de Turnos</h1>
        <p class="login-hint" data-i18n="loginHint"></p>

        <label for="password" data-i18n="passwordLabel">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>

        <button type="submit" class="download-btn" data-i18n="signIn">Ingresar</button>
        <p id="loginError" class="login-error" hidden></p>
    </form>

    <script src="i18n.js"></script>
    <script>
        const form = document.getElementById('loginForm');
        const errorEl = document.getElementById('loginError');
        const passwordEl = document.getElementById('password');

        applyStaticTranslations();
        buildLanguageSwitcher(document.getElementById('langSwitcher'), () => {
            // Re-translate any error already on screen.
            if (!errorEl.hidden && errorEl.dataset.errorKey) {
                errorEl.textContent = t(errorEl.dataset.errorKey, { status: errorEl.dataset.errorStatus || '' });
            }
        });

        function showError(key, vars) {
            errorEl.dataset.errorKey = key;
            errorEl.dataset.errorStatus = (vars && vars.status) || '';
            errorEl.textContent = t(key, vars);
            errorEl.hidden = false;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorEl.hidden = true;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: passwordEl.value })
                });

                if (res.ok) {
                    window.location.replace('/');
                    return;
                }

                if (res.status === 401) {
                    showError('errWrongPassword');
                } else {
                    showError('errSignIn', { status: res.status });
                }
            } catch (err) {
                showError('errNetwork');
            }

            passwordEl.value = '';
            passwordEl.focus();
        });
    </script>
</body>
</html>
