<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light">
    <title>Calendario de Turnos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-i18n-title="appTitle">

    <div class="header">
        <h1 data-i18n="appTitle">Calendario de Turnos</h1>
        <p class="subtitle" data-i18n="subtitle"></p>
    </div>

    <div class="controls">
        <div class="controls-row">
            <div class="control-group">
                <label for="yearSelect" data-i18n="yearLabel">Año</label>
                <select id="yearSelect" class="year-select"></select>
            </div>

            <div class="control-group">
                <label data-i18n="langLabel">Idioma</label>
                <div id="langSwitcher" class="lang-switcher"></div>
            </div>
        </div>

        <div class="controls-actions">
            <button id="swapModeBtn" class="download-btn swap-btn" onclick="toggleSwapMode()" data-i18n="swapDays">Intercambiar días</button>
        </div>

        <p class="swap-hint"><span id="pointerHint" data-i18n="hintPointer"></span><span id="touchHint" data-i18n="hintTouch" hidden></span><span id="fullscreenHint" data-i18n="hintFullscreen" hidden></span></p>
    </div>

    <div class="legend">
        <strong data-i18n="legend">Referencias:</strong>
        <div class="legend-item">
            <span class="legend-color work-day"></span> <span data-i18n="workDay"></span>
        </div>
        <div class="legend-item">
            <span class="legend-color off-day"></span> <span data-i18n="offDay"></span>
        </div>
        <div class="legend-item">
            <span class="legend-color work-day swapped"></span> <span data-i18n="swappedDay"></span>
        </div>
        <div class="legend-item">
            <span class="legend-color off-day manual-edit"></span> <span data-i18n="manualDay"></span>
        </div>
    </div>

    <div id="calendarContainer" class="calendar-grid"></div>

    <div id="fullscreenOverlay" class="fullscreen-overlay" hidden>
        <div class="fullscreen-panel">
            <div class="fullscreen-toolbar">
                <button id="fullscreenPrev" type="button" data-i18n="fsPrev"></button>
                <button id="fullscreenNext" type="button" data-i18n="fsNext"></button>
                <button id="fullscreenClose" type="button" class="fullscreen-close" data-i18n="fsClose"></button>
            </div>
            <div id="fullscreenMonth" class="fullscreen-month"></div>
        </div>
    </div>

    <script src="i18n.js"></script>
    <script src="script.js"></script>
</body>
</html>
